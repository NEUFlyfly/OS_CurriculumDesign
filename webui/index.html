<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>FlyflyUFS - Web 模拟 UNIX 文件系统</title>
<style>
/* ═══════════════════════════════════════════════════════
   FlyflyUFS — Apple Design Language Redesign
   Minimal, clean, premium — inspired by apple.com
   ═══════════════════════════════════════════════════════ */

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Design Tokens (Apple palette) ── */
:root {
  --bg: #000000;
  --bg2: #1d1d1f;
  --bg3: #2d2d2f;
  --fg: #f5f5f7;
  --fg2: #86868b;
  --accent: #ff453a;
  --green: #30d158;
  --yellow: #ff9f0a;
  --blue: #0a84ff;
  --sidebar-w: 260px;
  --header-h: 48px;
  --input-h: 52px;
  --radius: 12px;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: #000;
  color: var(--fg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: radial-gradient(ellipse at 50% 20%, #1d1d1f 0%, #000 80%);
}

/* ── Global Subtle Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #424245; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555557; }

/* ── Header (glass bar) ── */
#header {
  height: var(--header-h);
  background: rgba(29, 29, 31, 0.78);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

#header h1 {
  font-size: 17px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.2px;
  white-space: nowrap;
}

#header .badge {
  font-size: 11px;
  font-weight: 500;
  background: var(--bg3);
  padding: 2px 10px;
  border-radius: 20px;
  color: var(--fg2);
  letter-spacing: 0.3px;
}

#header .spacer { flex: 1; }

#header #user-status {
  font-size: 13px;
  color: var(--fg2);
}

#header #user-status .uname {
  color: var(--green);
  font-weight: 600;
}

#header #user-status .udir {
  color: var(--blue);
}

#header #user-status .nologin {
  color: var(--accent);
  font-weight: 500;
}

/* ── Layout ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar (clean dark panel) ── */
#sidebar {
  width: var(--sidebar-w);
  background: #1d1d1f;
  overflow-y: auto;
  flex-shrink: 0;
  padding-bottom: 16px;
  border-right: none;
}

#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: #424245; border-radius: 2px; }

.cat {
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.1px;
  user-select: none;
  transition: background 0.15s ease;
  color: var(--fg);
}

.cat-header:hover {
  background: rgba(255,255,255,0.04);
}

.cat-header .icon {
  font-size: 14px;
  opacity: 0.5;
}

.cat-header .arrow {
  margin-left: auto;
  font-size: 8px;
  color: var(--fg2);
  opacity: 0.35;
  transition: transform 0.25s ease;
}

.cat.open .cat-header .arrow {
  transform: rotate(90deg);
}

.cat-body {
  display: none;
  flex-direction: column;
}

.cat.open .cat-body {
  display: flex;
}

.cmd-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px 8px 42px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.12s ease;
  color: var(--fg2);
  border-radius: 6px;
  margin: 0 6px;
}

.cmd-item:hover {
  background: rgba(255,255,255,0.07);
  color: var(--fg);
}

.cmd-item .cmd-badge {
  font-size: 10px;
  font-weight: 500;
  background: rgba(255,255,255,0.08);
  color: var(--fg2);
  padding: 1px 8px;
  border-radius: 4px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  letter-spacing: 0.2px;
}

/* ── Content Area ── */
#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Terminal ── */
#terminal {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.7;
  background: #000;
}

#terminal::-webkit-scrollbar { width: 6px; }
#terminal::-webkit-scrollbar-thumb { background: #424245; border-radius: 3px; }

.term-line {
  white-space: pre-wrap;
  word-break: break-all;
  padding: 1px 0;
}

.term-line.cmd { color: var(--green); }
.term-line.error { color: var(--accent); }
.term-line.info { color: var(--blue); }
.term-line.output { color: var(--fg); }
.term-line.prompt { color: var(--yellow); }
.term-line.banner {
  color: var(--fg2);
  font-style: normal;
  opacity: 0.7;
}

/* ── Input Bar (glass) ── */
#input-bar {
  height: var(--input-h);
  background: rgba(29, 29, 31, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,0.05);
}

#input-bar .prompt-label {
  color: var(--green);
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}

#input-bar input {
  flex: 1;
  height: 36px;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: var(--fg);
  padding: 0 14px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease;
}

#input-bar input:focus {
  border-color: #0071e3;
  box-shadow: 0 0 0 3px rgba(0,113,227,0.2);
}

#input-bar input::placeholder {
  color: rgba(134,134,139,0.45);
}

#input-bar button {
  height: 36px;
  padding: 0 22px;
  background: #0071e3;
  color: #fff;
  border: none;
  border-radius: 20px;
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
}

#input-bar button:hover {
  background: #0077ed;
  transform: scale(1.02);
}

#input-bar button:active {
  transform: scale(0.98);
}

/* ── Modal (Apple sheet) ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  background: #2d2d2f;
  border: none;
  border-radius: 18px;
  width: 480px;
  max-width: 92vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.65);
  animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.94) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  padding: 20px 24px;
  font-weight: 600;
  font-size: 16px;
  color: var(--fg);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  letter-spacing: -0.2px;
}

.modal-body {
  padding: 22px 24px;
  overflow-y: auto;
  flex: 1;
}

.modal-body label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg2);
  margin-bottom: 6px;
  letter-spacing: 0.1px;
}

.modal-body input,
.modal-body textarea {
  width: 100%;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: var(--fg);
  padding: 10px 14px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
  transition: all 0.2s ease;
}

.modal-body textarea {
  min-height: 240px;
  resize: vertical;
  font-size: 13px;
  line-height: 1.5;
}

.modal-body input:focus,
.modal-body textarea:focus {
  border-color: #0071e3;
  box-shadow: 0 0 0 3px rgba(0,113,227,0.2);
}

.modal-footer {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  padding: 16px 24px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.modal-footer button {
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
}

.modal-footer .btn-primary {
  background: #0071e3;
  color: #fff;
}

.modal-footer .btn-primary:hover {
  background: #0077ed;
}

.modal-footer .btn-secondary {
  background: rgba(255,255,255,0.08);
  color: var(--fg);
}

.modal-footer .btn-secondary:hover {
  background: rgba(255,255,255,0.14);
}

.modal-footer .btn-danger {
  background: var(--accent);
  color: #fff;
}

.modal-footer .btn-danger:hover {
  background: #ff5a4a;
}

/* ── Dashboard ── */
#dashboard {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  background: transparent;
  display: none;
  flex-direction: column;
  gap: 28px;
}

#dashboard::-webkit-scrollbar { width: 6px; }
#dashboard::-webkit-scrollbar-thumb { background: #424245; border-radius: 3px; }

/* Dashboard title bar — Apple-style (overrides JS inline styles) */
#dashboard > div:first-child {
  margin-bottom: 0 !important;
}

#dashboard > div:first-child > span {
  font-size: 20px !important;
  font-weight: 700 !important;
  letter-spacing: -0.3px !important;
}

#dashboard > div:first-child > button {
  background: transparent !important;
  color: #0071e3 !important;
  border: 1px solid rgba(0,113,227,0.25) !important;
  border-radius: 20px !important;
  padding: 6px 20px !important;
  font-weight: 500 !important;
  font-size: 13px !important;
  transition: all 0.2s ease !important;
}

#dashboard > div:first-child > button:hover {
  background: rgba(0,113,227,0.08) !important;
}

/* ── Entry Animations ── */
.db-fade-in {
  animation: dbFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  opacity: 0;
}

@keyframes dbFadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.db-delay-1 { animation-delay: 0.05s; }
.db-delay-2 { animation-delay: 0.15s; }
.db-delay-3 { animation-delay: 0.25s; }
.db-delay-4 { animation-delay: 0.35s; }
.db-delay-5 { animation-delay: 0.45s; }
.db-delay-6 { animation-delay: 0.55s; }

.db-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 16px;
  letter-spacing: -0.1px;
  border-bottom: none;
}

/* ── Section 1: Stats Cards (Apple-style cards) ── */
.db-cards-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.db-card {
  background: #1d1d1f;
  border-radius: 14px;
  padding: 20px;
  border-left: none;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}

.db-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 48px rgba(0,0,0,0.45);
}

.db-card::after {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
  pointer-events: none;
}

.db-card-icon {
  font-size: 16px;
  margin-bottom: 8px;
  opacity: 0.4;
}

.db-card-label {
  font-size: 11px;
  color: var(--fg2);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
  margin-bottom: 2px;
}

.db-card-value {
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 32px;
  font-weight: 700;
  margin: 6px 0 4px;
  line-height: 1.1;
  letter-spacing: -0.5px;
}

.db-card-detail {
  font-size: 11px;
  color: var(--fg2);
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
}

.db-card.c-disk .db-card-value { color: #ff453a; }
.db-card.c-inode .db-card-value { color: #0a84ff; }
.db-card.c-dir .db-card-value { color: #ff9f0a; }
.db-card.c-file .db-card-value { color: #30d158; }

/* ── Section 2: Donut Charts ── */
.db-charts-row {
  display: flex;
  gap: 36px;
  flex-wrap: wrap;
  justify-content: center;
}

.db-chart-wrap {
  text-align: center;
  position: relative;
}

/* Override inline canvas border for Apple look */
.db-chart-wrap canvas {
  border: none !important;
  border-radius: 16px !important;
  box-shadow: 0 4px 28px rgba(0,0,0,0.4) !important;
}

.db-chart-label {
  font-size: 12px;
  color: var(--fg2);
  margin-top: 10px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  letter-spacing: 0.2px;
}

/* ── Section 3: Block Allocation Map ── */
.db-blockmap-wrap {
  position: relative;
  display: inline-block;
  background: #1d1d1f;
  border-radius: 14px;
  border: none;
  padding: 16px;
  overflow-x: auto;
  box-shadow: 0 2px 14px rgba(0,0,0,0.3);
}

.db-blockmap-canvas {
  display: block;
  margin: 0 auto;
  image-rendering: pixelated;
}

.db-blockmap-tooltip {
  position: absolute;
  display: none;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--fg);
  padding: 6px 12px;
  border-radius: 8px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 11px;
  pointer-events: none;
  z-index: 10;
  white-space: nowrap;
  border: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
}

.db-blockmap-legend {
  display: flex;
  gap: 22px;
  margin-top: 12px;
  font-size: 12px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  align-items: center;
  flex-wrap: wrap;
  color: var(--fg2);
}

.db-blockmap-legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.db-blockmap-legend .swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Section 4: Directory Tree ── */
.db-tree {
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.8;
  background: #1d1d1f;
  border-radius: 12px;
  padding: 16px 20px;
  border: none;
  max-height: 400px;
  overflow-y: auto;
  box-shadow: 0 2px 14px rgba(0,0,0,0.25);
}

.db-tree::-webkit-scrollbar { width: 4px; }
.db-tree::-webkit-scrollbar-thumb { background: #424245; border-radius: 2px; }

.db-tree-item {
  padding: 2px 0;
  cursor: pointer;
  user-select: none;
  border-radius: 4px;
}

.db-tree-item:hover {
  background: rgba(255,255,255,0.04);
}

.db-tree-toggle {
  display: inline-block;
  width: 14px;
  font-size: 8px;
  color: var(--fg2);
  opacity: 0.45;
  text-align: center;
  vertical-align: middle;
}

.db-tree-name {
  color: var(--blue);
}

.db-tree-name.file {
  color: var(--fg);
}

.db-tree-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  padding: 1px 8px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
  line-height: 1.4;
}

.db-tree-badge.dir-badge {
  background: rgba(10,132,255,0.15);
  color: var(--blue);
}

.db-tree-badge.file-badge {
  background: rgba(255,159,10,0.15);
  color: var(--yellow);
}

.db-tree-size {
  float: right;
  color: var(--fg2);
  font-size: 11px;
  line-height: 1.8;
}

.db-tree-children {
  padding-left: 22px;
}

/* ── Section 5: User Storage Bars ── */
.db-userbar-section {
  padding: 4px 0;
}

.db-userbar-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.db-userbar-label {
  width: 80px;
  font-size: 13px;
  font-weight: 500;
  color: var(--green);
  text-align: right;
  flex-shrink: 0;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.db-userbar-track {
  flex: 1;
  height: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.db-userbar-fill {
  height: 100%;
  border-radius: 10px;
  background: linear-gradient(90deg, #30d158, #0a84ff) !important;
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.db-userbar-text {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: var(--fg2);
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  white-space: nowrap;
}

/* ── Section 6: Superblock Info Grid ── */
.db-sb-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  overflow: hidden;
  border: none;
  box-shadow: 0 2px 14px rgba(0,0,0,0.25);
}

.db-sb-item {
  background: #1d1d1f;
  padding: 16px 18px;
}

.db-sb-item .sb-label {
  font-size: 11px;
  color: var(--fg2);
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.db-sb-item .sb-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--fg);
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  letter-spacing: -0.3px;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .db-cards-row { grid-template-columns: repeat(2, 1fr); }
  #dashboard .db-charts-row { flex-direction: column; align-items: center; }
  .db-sb-grid { grid-template-columns: repeat(2, 1fr); }
  #dashboard { padding: 20px; gap: 20px; }
}

@media (max-width: 700px) {
  #sidebar { width: 200px; }
  #sidebar .cmd-item { padding-left: 28px; font-size: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <h1>FlyflyUFS</h1><span class="badge">v1.0 Web</span>
    <div class="spacer"></div>
    <div id="user-status"><span class="nologin">⛔ 未登录</span></div>
  </div>

  <div id="main">
    <!-- Sidebar -->
    <nav id="sidebar"></nav>

    <!-- Content -->
    <div id="content">
      <div id="terminal"><div class="term-line banner">FlyflyUFS Web Console 已就绪。使用下方输入框或点击侧栏命令。</div></div>
      <div id="dashboard"></div>
      <div id="input-bar">
        <span class="prompt-label">$</span>
        <input id="cmd-input" type="text" placeholder="输入命令..." spellcheck="false" autofocus>
        <button id="cmd-exec">执行</button>
      </div>

<script>
// ============================================================
// 1. CONSTANTS
// ============================================================
const C = {};
// C++ const.h exact layout (all block addresses in bytes)
// Block 0: superblock | Blocks 1-2: inode bitmap | Blocks 3-22: block bitmap
// Block 23+: inode table (640 inodes * 128B = 160 blocks) | then data blocks
(function(){
  const INODE_NUM=640, BLOCK_SIZE=512, INODE_SIZE=128;
  C.MODE_DIR = 01000; C.MODE_FILE = 0;
  C.FILE_DEF_PERMISSION = 0664; C.DIR_DEFAULT_PERMISSION = 0755;
  C.FILE_BUFFER = 10000; C.BLOCK_SIZE = BLOCK_SIZE; C.INODE_SIZE = INODE_SIZE;
  C.MAX_NAME_SIZE = 28; C.INODE_NUM = INODE_NUM; C.BLOCK_NUM = 10240;
  C.BLOCKS_PER_GROUP = 64; C.HOSTNAME = 'chaosmyth';
  // Addresses
  C.SUPERBLOCK_START_ADDR = 0;
  C.INODEBITMAP_START_ADDR = 1 * BLOCK_SIZE;                      // block 1
  C.BLOCKBITMAP_START_ADDR = 1*BLOCK_SIZE + 2*BLOCK_SIZE;          // block 3
  C.INODE_START_ADDR = C.BLOCKBITMAP_START_ADDR + 20*BLOCK_SIZE;   // block 23 = 11776
  const inodeBlocks = Math.ceil(INODE_NUM / (BLOCK_SIZE / INODE_SIZE)); // 160
  C.BLOCK_STARTADDR = C.INODE_START_ADDR + inodeBlocks * BLOCK_SIZE;   // 93696
  C.ROOT_DIR_ADDR = C.INODE_START_ADDR;                                 // 11776
})();

// ============================================================
// 2. INDEXEDDB PERSISTENCE LAYER
// ============================================================
const DB_NAME = 'FlyflyUFS', DB_VER = 2;
function dbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      // Drop existing stores to force clean re-format (fixed free-block bug)
      for (const name of ['meta', 'inodes', 'blocks', 'users']) {
        if (db.objectStoreNames.contains(name)) db.deleteObjectStore(name);
      }
      db.createObjectStore('meta', { keyPath: 'key' });
      db.createObjectStore('inodes', { keyPath: 'addr' });
      db.createObjectStore('blocks', { keyPath: 'addr' });
      db.createObjectStore('users', { keyPath: 'username' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function dbGet(store, key) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => { resolve(req.result); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function dbPut(store, value) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => { resolve(); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function dbDel(store, key) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => { resolve(); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function dbGetAll(store) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => { resolve(req.result); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function dbGetKeys(store) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAllKeys();
    req.onsuccess = () => { resolve(req.result); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}

// ============================================================
// 3. FILESYSTEM STATE
// ============================================================
let FS = {
  superBlock: null,
  inodeBitmap: new Uint8Array(C.INODE_NUM),
  blockBitmap: new Uint8Array(C.BLOCK_NUM),
  initialized: false,
  // Session
  cur_user_name: '',
  cur_group_name: '',
  cur_dir_addr: C.ROOT_DIR_ADDR,
  cur_dir_name: '/',
  cur_user_dir_name: '',
  is_login: false,
  nextUID: 1,
  nextGID: 1,
};

// In-memory block cache (for performance, synced to DB)
let blockCache = new Map();
let inodeCache = new Map();

function mkSuperBlock() {
  return {
    s_INODE_NUM: C.INODE_NUM,
    s_BLOCK_NUM: C.BLOCK_NUM,
    s_free_INODE_NUM: C.INODE_NUM,
    s_free_BLOCK_NUM: C.BLOCK_NUM,
    s_free_addr: C.BLOCK_STARTADDR,
    s_free: new Array(C.BLOCKS_PER_GROUP).fill(-1),
    s_BLOCK_SIZE: C.BLOCK_SIZE,
    s_INODE_SIZE: C.INODE_SIZE,
    s_SUPERBLOCK_SIZE: 512,
    s_blocks_per_group: C.BLOCKS_PER_GROUP,
    s_Superblock_StartAddr: C.SUPERBLOCK_START_ADDR,
    s_InodeBitmap_StartAddr: C.INODEBITMAP_START_ADDR,
    s_BlockBitmap_StartAddr: C.BLOCKBITMAP_START_ADDR,
    s_Inode_StartAddr: C.INODE_START_ADDR,
    s_Block_StartAddr: C.BLOCK_STARTADDR
  };
}

// ============================================================
// 4. FILESYSTEM CORE OPERATIONS
// ============================================================

// --- Inode read/write helpers ---
function inodeAddr(pos) { return C.INODE_START_ADDR + pos * C.INODE_SIZE; }
function blockAddr(pos) { return C.BLOCK_STARTADDR + pos * C.BLOCK_SIZE; }
function posFromInodeAddr(addr) { return Math.floor((addr - C.INODE_START_ADDR) / C.INODE_SIZE); }
function posFromBlockAddr(addr) { return Math.floor((addr - C.BLOCK_STARTADDR) / C.BLOCK_SIZE); }

async function readInode(addr) {
  if (inodeCache.has(addr)) return inodeCache.get(addr);
  const data = await dbGet('inodes', addr);
  if (data) { inodeCache.set(addr, data); return data; }
  return null;
}
async function writeInode(addr, inode) {
  inodeCache.set(addr, inode);
  await dbPut('inodes', { addr, ...inode });
}
async function readBlock(addr) {
  if (blockCache.has(addr)) return blockCache.get(addr);
  const data = await dbGet('blocks', addr);
  if (data) { blockCache.set(addr, data.data); return data.data; }
  return null;
}
async function writeBlock(addr, dataStr) {
  blockCache.set(addr, dataStr);
  await dbPut('blocks', { addr, data: dataStr });
}

// --- Bitmap ---
async function loadBitmaps() {
  const ib = await dbGet('meta', 'inodeBitmap');
  if (ib) FS.inodeBitmap = new Uint8Array(ib.value);
  const bb = await dbGet('meta', 'blockBitmap');
  if (bb) FS.blockBitmap = new Uint8Array(bb.value);
}
async function saveBitmaps() {
  await dbPut('meta', { key: 'inodeBitmap', value: Array.from(FS.inodeBitmap) });
  await dbPut('meta', { key: 'blockBitmap', value: Array.from(FS.blockBitmap) });
}

// --- INode allocation ---
async function INodeAlloc() {
  if (FS.superBlock.s_free_INODE_NUM === 0) { return -1; }
  for (let i = 0; i < FS.superBlock.s_INODE_NUM; i++) {
    if (FS.inodeBitmap[i] === 0) {
      FS.superBlock.s_free_INODE_NUM--;
      FS.inodeBitmap[i] = 1;
      await saveSuperBlock();
      await saveBitmaps();
      return inodeAddr(i);
    }
  }
  return -1;
}
async function INodeFree(addr) {
  const pos = posFromInodeAddr(addr);
  if (pos < 0 || pos >= C.INODE_NUM || FS.inodeBitmap[pos] === 0) return false;
  FS.superBlock.s_free_INODE_NUM++;
  FS.inodeBitmap[pos] = 0;
  inodeCache.delete(addr);
  await dbDel('inodes', addr);
  await saveSuperBlock();
  await saveBitmaps();
  return true;
}

// --- Block allocation (port of C++ group-linking method) ---
async function BlockAlloc() {
  if (FS.superBlock.s_free_BLOCK_NUM === 0) return -1;
  const top = (FS.superBlock.s_free_BLOCK_NUM - 1) % FS.superBlock.s_blocks_per_group;
  let allocAddr;
  if (top === 0) {
    allocAddr = FS.superBlock.s_free_addr;
    FS.superBlock.s_free_addr = FS.superBlock.s_free[0];
    // Read next free block group
    const nextData = await readBlockDataByAddr(FS.superBlock.s_free_addr);
    if (nextData) {
      for (let i = 0; i < C.BLOCKS_PER_GROUP; i++) FS.superBlock.s_free[i] = nextData[i];
    }
    FS.superBlock.s_free_BLOCK_NUM--;
  } else {
    allocAddr = FS.superBlock.s_free[top];
    FS.superBlock.s_free[top] = -1;
    FS.superBlock.s_free_BLOCK_NUM--;
  }
  const bid = posFromBlockAddr(allocAddr);
  if (bid >= 0 && bid < C.BLOCK_NUM) FS.blockBitmap[bid] = 1;
  await saveSuperBlock();
  await saveBitmaps();
  return allocAddr;
}

async function readBlockDataByAddr(addr) {
  const data = await readBlock(addr);
  if (!data) return null;
  return new Int32Array(data.split(',').map(Number));
}

async function writeBlockDataAsAddrs(addr, arr) {
  await writeBlock(addr, arr.join(','));
}

// FreeBlock
async function FreeBlock(addr) {
  const bid = posFromBlockAddr(addr);
  if (bid < 0 || bid >= C.BLOCK_NUM || FS.blockBitmap[bid] === 0) return false;
  if (FS.superBlock.s_free_BLOCK_NUM === FS.superBlock.s_BLOCK_NUM) return false;
  const top = (FS.superBlock.s_free_BLOCK_NUM - 1) % FS.superBlock.s_blocks_per_group;
  // Clear block data
  await writeBlock(addr, '');
  if (top === FS.superBlock.s_blocks_per_group - 1) {
    const newStack = new Array(C.BLOCKS_PER_GROUP).fill(-1);
    newStack[0] = FS.superBlock.s_free_addr;
    FS.superBlock.s_free_addr = addr;
    await writeBlockDataAsAddrs(addr, newStack);
  } else {
    FS.superBlock.s_free[top + 1] = addr;
  }
  FS.superBlock.s_free_BLOCK_NUM++;
  FS.blockBitmap[bid] = 0;
  blockCache.delete(addr);
  await saveSuperBlock();
  await saveBitmaps();
  return true;
}

// --- SuperBlock persistence ---
async function saveSuperBlock() {
  await dbPut('meta', { key: 'superBlock', value: FS.superBlock });
}
async function loadSuperBlock() {
  const sb = await dbGet('meta', 'superBlock');
  if (sb) FS.superBlock = sb.value;
}

// ============================================================
// 5. DIRECTORY OPERATIONS
// ============================================================

// Helper: make a new inode object
function newINode() {
  return {
    inode_id: 0, inode_mode: 0, inode_cnt: 0,
    user_name: '', user_group: '',
    inode_size: 0,
    inode_dirblock: new Array(10).fill(-1),
    inode_indirect_block_first: -1
  };
}

// Helper: pack Dir entries into string for a block (ALWAYS 16 entries per block)
function packDirEntries(entries) {
  const padded = [...entries];
  while (padded.length < 16) padded.push({ name: '', inode_addr: -1 });
  return padded.map(e => e.name + '|' + e.inode_addr).join('\n');
}
function unpackDirEntries(blockData) {
  if (!blockData || blockData === '') return [];
  return blockData.split('\n').filter(line => line).map(line => {
    const idx = line.lastIndexOf('|');
    if (idx < 0) return { name: '', inode_addr: -1 };
    return { name: line.substring(0, idx), inode_addr: parseInt(line.substring(idx+1)) };
  });
}

// Search parent directory for a name, return { dirEntry, blockAddr, blockIndex, entries }
async function findDirEntry(parentInodeAddr, name) {
  const parentInode = await readInode(parentInodeAddr);
  if (!parentInode) return null;
  for (let di = 0; di < 10; di++) {
    const ba = parentInode.inode_dirblock[di];
    if (ba === -1) continue;
    const data = await readBlock(ba);
    if (data === null || data === undefined) continue;
    const entries = unpackDirEntries(data);
    for (let j = 0; j < entries.length; j++) {
      if (entries[j].name === name) {
        return { entry: entries[j], blockAddr: ba, blockIndex: j, entries, parentInode: parentInode };
      }
    }
  }
  return null;
}

// FindDir: navigate to directory
async function FindDir(curDirAddr, name) {
  if (name === '.') { return curDirAddr; }
  if (name === '..') {
    // Read current directory's inode, find .. entry
    const curInode = await readInode(curDirAddr);
    if (!curInode) { printLine('无法读取当前目录', 'error'); return -1; }
    const ba = curInode.inode_dirblock[0];
    if (ba === -1) { printLine('无法找到父目录', 'error'); return -1; }
    const data = await readBlock(ba);
    if (!data) { printLine('无法读取父目录', 'error'); return -1; }
    const entries = unpackDirEntries(data);
    const dotdot = entries.find(e => e.name === '..');
    if (dotdot) return dotdot.inode_addr;
    return -1;
  }
  const result = await findDirEntry(curDirAddr, name);
  if (!result) { return -1; }
  const targetInode = await readInode(result.entry.inode_addr);
  if (!targetInode) return -1;
  const isDir = (targetInode.inode_mode >> 9) & 1;
  if (!isDir) return -2; // Not a directory
  // Permission check
  if (!checkPerm(targetInode, 2)) return -3;
  return result.entry.inode_addr;
}

// Permission check: op 2=read/enter, 1=write, 0=execute
function checkPerm(inode, op) {
  if (FS.cur_user_name === 'root') return true;
  let filemode = 0;
  if (FS.cur_user_name === inode.user_name) filemode = 6;
  else if (FS.cur_group_name === inode.user_group) filemode = 3;
  else filemode = 0;
  return ((inode.inode_mode >> filemode >> (2-op)) & 1) === 1;
}

// ShowDir: list directory contents
async function ShowDir(addr) {
  const inode = await readInode(addr);
  if (!inode) { printLine('无法读取目录', 'error'); return; }
  if (!checkPerm(inode, 2)) { printLine('Permission Dennied', 'error'); return; }
  const cnt = inode.inode_cnt;
  let count = 0;
  const lines = [];
  for (let di = 0; di < 10 && count < cnt; di++) {
    const ba = inode.inode_dirblock[di];
    if (ba === -1) continue;
    const data = await readBlock(ba);
    if (!data) continue;
    const entries = unpackDirEntries(data);
    for (const entry of entries) {
      if (!entry.name) continue;
      // Show . and .. only when directory is empty (no subdirs)
      if (cnt > 2 && (entry.name === '.' || entry.name === '..')) continue;
      count++;
      const target = await readInode(entry.inode_addr);
      if (!target) continue;
      const isDir = (target.inode_mode >> 9) & 1;
      const permStr = permToString(target.inode_mode);
      lines.push(`${isDir ? 'd' : '-'}${permStr}\t${target.inode_cnt}\t${target.user_name}\t${target.user_group}\t${target.inode_size} B\t${entry.name}`);
    }
  }
  for (const l of lines) printLine(l, 'output');
}

function permToString(mode) {
  let s = '';
  for (let i = 8; i >= 0; i--) {
    if ((mode >> i) & 1) {
      if (i % 3 === 2) s += 'r';
      else if (i % 3 === 1) s += 'w';
      else s += 'x';
    } else s += '-';
  }
  return s;
}

// MakeDir
async function MakeDir(parentAddr, name) {
  if (name.length >= C.MAX_NAME_SIZE) { printLine('超过最大目录长度', 'error'); return false; }
  const parentInode = await readInode(parentAddr);
  if (!parentInode) { printLine('无法读取父目录', 'error'); return false; }
  if (!checkPerm(parentInode, 1)) { printLine('Permission Dennied', 'error'); return false; }

  // Check if exists
  let findPos = { blockIdx: -1, entryIdx: -1 };
  for (let di = 0; di < 10; di++) {
    const ba = parentInode.inode_dirblock[di];
    if (ba === -1) continue;
    const data = await readBlock(ba);
    if (!data) continue;
    const entries = unpackDirEntries(data);
    for (let j = 0; j < entries.length; j++) {
      if (entries[j].name === name) {
        // Check if it's a directory
        const t = await readInode(entries[j].inode_addr);
        if (t && ((t.inode_mode >> 9) & 1)) { printLine('目录已存在', 'error'); return false; }
      }
      if (entries[j].name === '' && findPos.blockIdx === -1) {
        findPos = { blockIdx: di, entryIdx: j };
      }
    }
  }
  if (findPos.blockIdx === -1) { printLine('无空闲目录项', 'error'); return false; }

  // Allocate inode for new directory
  const newInodeAddr = await INodeAlloc();
  if (newInodeAddr === -1) { printLine('inode节点不够', 'error'); return false; }
  const newBlockAddr = await BlockAlloc();
  if (newBlockAddr === -1) { printLine('block分配失败', 'error'); return false; }

  // Create . and .. entries
  const dotEntries = [
    { name: '.', inode_addr: newInodeAddr },
    { name: '..', inode_addr: parentAddr }
  ];
  await writeBlock(newBlockAddr, packDirEntries(dotEntries));

  const newInode = newINode();
  newInode.inode_id = posFromInodeAddr(newInodeAddr);
  newInode.user_name = FS.cur_user_name;
  newInode.user_group = FS.cur_group_name;
  newInode.inode_cnt = 2;
  newInode.inode_dirblock[0] = newBlockAddr;
  newInode.inode_size = C.BLOCK_SIZE;
  newInode.inode_mode = C.MODE_DIR | C.DIR_DEFAULT_PERMISSION;
  await writeInode(newInodeAddr, newInode);

  // Add entry to parent
  const ba = parentInode.inode_dirblock[findPos.blockIdx];
  const oldData = await readBlock(ba);
  const entries = unpackDirEntries(oldData);
  entries[findPos.entryIdx] = { name, inode_addr: newInodeAddr };
  await writeBlock(ba, packDirEntries(entries));

  parentInode.inode_cnt++;
  await writeInode(parentAddr, parentInode);
  return true;
}

// DeleteDir
async function DeleteDir(parentAddr, name) {
  if (name === '.' || name === '..') { printLine('不能删除当前目录或者上级目录', 'error'); return false; }
  const result = await findDirEntry(parentAddr, name);
  if (!result) { printLine(`${name}: No such file or directory`, 'error'); return false; }
  const targetInode = await readInode(result.entry.inode_addr);
  if (!targetInode || !((targetInode.inode_mode >> 9) & 1)) { printLine(`不是目录`, 'error'); return false; }
  if (!checkPerm(targetInode, 1)) { printLine('Permission Dennied', 'error'); return false; }
  await deleteFileOrDirRecursive(result.entry.inode_addr);
  // Remove entry from parent
  result.entries[result.blockIndex] = { name: '', inode_addr: -1 };
  await writeBlock(result.blockAddr, packDirEntries(result.entries));
  result.parentInode.inode_cnt--;
  await writeInode(parentAddr, result.parentInode);
  return true;
}

async function deleteFileOrDirRecursive(addr) {
  const inode = await readInode(addr);
  if (!inode) return;
  const isDir = (inode.inode_mode >> 9) & 1;
  if (isDir) {
    const cnt = inode.inode_cnt;
    let freed = false;
    for (let di = 0; di < 10; di++) {
      const ba = inode.inode_dirblock[di];
      if (ba === -1) continue;
      const data = await readBlock(ba);
      if (!data) continue;
      const entries = unpackDirEntries(data);
      for (const entry of entries) {
        if (entry.name && entry.name !== '.' && entry.name !== '..') {
          freed = true;
          await deleteFileOrDirRecursive(entry.inode_addr);
        }
      }
      if (freed) await FreeBlock(ba);
    }
    await INodeFree(addr);
  } else {
    // File: free blocks then inode
    for (let di = 0; di < 10; di++) {
      if (inode.inode_dirblock[di] !== -1) await FreeBlock(inode.inode_dirblock[di]);
    }
    await INodeFree(addr);
  }
}

// Touch: create empty file
async function Touch(parentAddr, name) {
  if (name.length >= C.MAX_NAME_SIZE) { printLine('超过最长文件名', 'error'); return false; }
  const parentInode = await readInode(parentAddr);
  if (!parentInode || !checkPerm(parentInode, 1)) { printLine('Permission Dennied', 'error'); return false; }
  // Check existing
  let findPos = { blockIdx: -1, entryIdx: -1 };
  for (let di = 0; di < 10; di++) {
    const ba = parentInode.inode_dirblock[di];
    if (ba === -1) continue;
    const data = await readBlock(ba);
    if (!data) continue;
    const entries = unpackDirEntries(data);
    for (let j = 0; j < entries.length; j++) {
      if (entries[j].name === name) {
        const t = await readInode(entries[j].inode_addr);
        if (t && !((t.inode_mode >> 9) & 1)) { printLine('该文件已经存在', 'error'); return false; }
      }
      if (entries[j].name === '' && findPos.blockIdx === -1) {
        findPos = { blockIdx: di, entryIdx: j };
      }
    }
  }
  if (findPos.blockIdx === -1) { printLine('无空闲目录项', 'error'); return false; }
  return createFile(parentAddr, name, '', findPos, parentInode);
}

async function createFile(parentAddr, name, content, findPos, parentInode) {
  const newInodeAddr = await INodeAlloc();
  if (newInodeAddr === -1) { printLine('INode 分配失败', 'error'); return false; }
  const newInode = newINode();
  newInode.inode_id = posFromInodeAddr(newInodeAddr);
  newInode.user_name = FS.cur_user_name;
  newInode.user_group = FS.cur_group_name;
  newInode.inode_cnt = 1;

  if (content.length > 0) {
    for (let offset = 0; offset < content.length; offset += C.BLOCK_SIZE) {
      const ba = await BlockAlloc();
      if (ba === -1) { printLine('Block分配失败', 'error'); return false; }
      newInode.inode_dirblock[Math.floor(offset / C.BLOCK_SIZE)] = ba;
      const chunk = content.substring(offset, offset + C.BLOCK_SIZE);
      await writeBlock(ba, chunk);
    }
  }
  if (content.length === 0) {
    const ba = await BlockAlloc();
    if (ba === -1) { printLine('Block分配失败', 'error'); return false; }
    newInode.inode_dirblock[0] = ba;
    await writeBlock(ba, '');
  }
  newInode.inode_size = content.length;
  newInode.inode_mode = C.MODE_FILE | C.FILE_DEF_PERMISSION;
  await writeInode(newInodeAddr, newInode);

  // Add to parent
  const ba = parentInode.inode_dirblock[findPos.blockIdx];
  const oldData = await readBlock(ba);
  const entries = unpackDirEntries(oldData);
  entries[findPos.entryIdx] = { name, inode_addr: newInodeAddr };
  await writeBlock(ba, packDirEntries(entries));
  parentInode.inode_cnt++;
  await writeInode(parentAddr, parentInode);
  return true;
}

// Cat: read file content
async function Cat(parentAddr, name) {
  const result = await findDirEntry(parentAddr, name);
  if (!result) { printLine(`cat ${name} : No such file`, 'error'); return null; }
  const inode = await readInode(result.entry.inode_addr);
  if (!inode || ((inode.inode_mode >> 9) & 1)) { printLine(`cat ${name} : No such file`, 'error'); return null; }
  if (!checkPerm(inode, 2)) { printLine('Permission denied.', 'error'); return null; }
  return readFileContent(inode);
}

async function readFileContent(inode) {
  let content = '';
  const len = inode.inode_size;
  let readLen = 0;
  for (let di = 0; di < 10; di++) {
    const ba = inode.inode_dirblock[di];
    if (ba === -1) continue;
    const data = await readBlock(ba);
    if (!data) continue;
    for (let ci = 0; ci < data.length && readLen < len; ci++) {
      content += data[ci];
      readLen++;
    }
    if (readLen >= len) break;
  }
  return content;
}

// Remove file
async function RemoveFile(parentAddr, name) {
  const result = await findDirEntry(parentAddr, name);
  if (!result) { printLine(`${name}: No such file or directory`, 'error'); return false; }
  const inode = await readInode(result.entry.inode_addr);
  if (!inode) return false;
  if (!checkPerm(result.parentInode, 1)) { printLine('Permission Dennied', 'error'); return false; }
  if ((inode.inode_mode >> 9) & 1) { printLine(`${name} 是目录，使用 rmdir`, 'error'); return false; }
  for (let di = 0; di < 10; di++) {
    if (inode.inode_dirblock[di] !== -1) await FreeBlock(inode.inode_dirblock[di]);
  }
  await INodeFree(result.entry.inode_addr);
  result.entries[result.blockIndex] = { name: '', inode_addr: -1 };
  await writeBlock(result.blockAddr, packDirEntries(result.entries));
  result.parentInode.inode_cnt--;
  await writeInode(parentAddr, result.parentInode);
  return true;
}

// WriteFile (for nano save)
async function WriteFile(inodeAddr, content) {
  const inode = await readInode(inodeAddr);
  if (!inode) return false;
  if (!checkPerm(inode, 1)) { printLine('Permission denied.', 'error'); return false; }
  // Free old blocks
  for (let di = 0; di < 10; di++) {
    if (inode.inode_dirblock[di] !== -1) {
      await FreeBlock(inode.inode_dirblock[di]);
      inode.inode_dirblock[di] = -1;
    }
  }
  // Write new content
  for (let offset = 0; offset < content.length; offset += C.BLOCK_SIZE) {
    const ba = await BlockAlloc();
    if (ba === -1) { printLine('Block分配失败', 'error'); return false; }
    inode.inode_dirblock[Math.floor(offset / C.BLOCK_SIZE)] = ba;
    const chunk = content.substring(offset, offset + C.BLOCK_SIZE);
    await writeBlock(ba, chunk);
  }
  if (content.length === 0) {
    const ba = await BlockAlloc();
    if (ba === -1) return false;
    inode.inode_dirblock[0] = ba;
    await writeBlock(ba, '');
  }
  inode.inode_size = content.length;
  await writeInode(inodeAddr, inode);
  return true;
}

async function getUserDbPath() {
  // Navigate to /etc
  const rootInode = await readInode(C.ROOT_DIR_ADDR);
  const etcResult = await findDirEntry(C.ROOT_DIR_ADDR, 'etc');
  if (!etcResult) return null;

}

async function readTextFile(inodeAddr) {
  const inode = await readInode(inodeAddr);
  if (!inode) return '';
  return await readFileContent(inode);
}

async function writeTextFile(inodeAddr, content) {
  await WriteFile(inodeAddr, content);
}

async function findInDir(parentAddr, name) {
  const result = await findDirEntry(parentAddr, name);
  return result ? result.entry.inode_addr : -1;
}

async function doLoginInternal(username, password) {
  // Navigate to /etc
  const etcAddr = await findInDir(C.ROOT_DIR_ADDR, 'etc');
  if (etcAddr === -1) { printLine('系统未初始化', 'error'); return false; }
  const userAddr = await findInDir(etcAddr, 'user');
  const passwdAddr = await findInDir(etcAddr, 'passwd');
  if (userAddr === -1 || passwdAddr === -1) { printLine('系统文件缺失', 'error'); return false; }

  const userContent = await readTextFile(userAddr);
  const passwdContent = await readTextFile(passwdAddr);

  if (!userContent.includes(username)) { printLine('用户不存在', 'error'); return false; }

  // Extract password
  const lines = passwdContent.split('\n');
  let found = false;
  for (const line of lines) {
    const parts = line.split(':');
    if (parts[0] === username) {
      if (parts[1] === password) found = true;
      else { printLine('密码错误', 'error'); return false; }
      break;
    }
  }
  if (!found) { printLine('passwd文件中不存在该用户', 'error'); return false; }

  // Login success
  FS.cur_user_name = username;
  FS.cur_group_name = (username === 'root') ? 'root' : 'user';
  FS.is_login = true;
  // Navigate to home dir
  await cdToHome(username);
  FS.cur_user_dir_name = FS.cur_dir_name;
  await saveSession();
  return true;
}

async function cdToHome(username) {
  const homeAddr = await findInDir(C.ROOT_DIR_ADDR, 'home');
  if (homeAddr === -1) { FS.cur_dir_addr = C.ROOT_DIR_ADDR; FS.cur_dir_name = '/'; return; }
  const userHomeAddr = await findInDir(homeAddr, username);
  if (userHomeAddr === -1) { FS.cur_dir_addr = homeAddr; FS.cur_dir_name = '/home'; return; }
  FS.cur_dir_addr = userHomeAddr;
  FS.cur_dir_name = '/home/' + username;
}

async function doUseraddInternal(username, password) {
  if (FS.cur_user_name !== 'root') { printLine('非root用户, 不能添加新用户', 'error'); return; }

  const etcAddr = await findInDir(C.ROOT_DIR_ADDR, 'etc');

  // Find user, passwd, group file inodes
  const userAddr = await findInDir(etcAddr, 'user');
  const passwdAddr = await findInDir(etcAddr, 'passwd');
  const groupAddr = await findInDir(etcAddr, 'group');
  if (userAddr === -1 || passwdAddr === -1 || groupAddr === -1) {
    printLine('系统文件缺失', 'error'); return;
  }

  let userContent = await readTextFile(userAddr);
  let passwdContent = await readTextFile(passwdAddr);
  let groupContent = await readTextFile(groupAddr);

  if (userContent.includes(username)) { printLine('用户已经存在', 'error'); return; }

  // Create home directory
  const oldUser = FS.cur_user_name;
  const oldGroup = FS.cur_group_name;
  const oldDir = FS.cur_dir_addr;
  const oldDirName = FS.cur_dir_name;

  // Temporarily change to new user context for creating home dir
  FS.cur_user_name = username;
  FS.cur_group_name = 'user';
  const homeAddr = await findInDir(C.ROOT_DIR_ADDR, 'home');
  if (homeAddr !== -1) {
    await MakeDir(homeAddr, username);
    // chmod 0600
    const homeInode = await readInode(homeAddr);
    if (homeInode) {
      for (let di = 0; di < 10; di++) {
        const ba = homeInode.inode_dirblock[di];
        if (ba === -1) continue;
        const data = await readBlock(ba);
        if (!data) continue;
        const entries = unpackDirEntries(data);
        for (const entry of entries) {
          if (entry.name === username) {
            const target = await readInode(entry.inode_addr);
            if (target) {
              target.inode_mode = (target.inode_mode >> 9 << 9) | 0600;
              await writeInode(entry.inode_addr, target);
            }
          }
        }
      }
    }
  }

  // Restore context
  FS.cur_user_name = oldUser;
  FS.cur_group_name = oldGroup;
  FS.cur_dir_addr = oldDir;
  FS.cur_dir_name = oldDirName;

  // Update user file
  userContent += `${username}:x:${FS.nextUID}:1\n`;
  FS.nextUID++;
  await writeTextFile(userAddr, userContent);

  // Update passwd file
  passwdContent += `${username}:${password}\n`;
  await writeTextFile(passwdAddr, passwdContent);

  // Update group file
  if (groupContent.endsWith(':\n') || groupContent.endsWith(':')) {
    groupContent = groupContent.replace(/:(\n)?$/, `:${username}\n`);
  } else if (groupContent.endsWith('\n')) {
    groupContent = groupContent.replace(/\n$/, `,${username}\n`);
  } else {
    groupContent += `,${username}\n`;
  }
  await writeTextFile(groupAddr, groupContent);

  printLine('用户注册成功', 'info');
  await saveSession();
}

async function doUserdelInternal(username) {
  if (username === 'root') { printLine('无法删除root用户', 'error'); return; }
  if (FS.cur_user_name !== 'root') { printLine('非root用户, 不能删除用户', 'error'); return; }

  const etcAddr = await findInDir(C.ROOT_DIR_ADDR, 'etc');
  const userAddr = await findInDir(etcAddr, 'user');
  const passwdAddr = await findInDir(etcAddr, 'passwd');
  const groupAddr = await findInDir(etcAddr, 'group');

  let userContent = await readTextFile(userAddr);
  let passwdContent = await readTextFile(passwdAddr);
  let groupContent = await readTextFile(groupAddr);

  if (!userContent.includes(username)) { printLine('用户不存在', 'error'); return; }

  userContent = removeLineContaining(userContent, username);
  passwdContent = removeLineContaining(passwdContent, username);
  groupContent = removeUserFromGroup(groupContent, username);

  await writeTextFile(userAddr, userContent);
  await writeTextFile(passwdAddr, passwdContent);
  await writeTextFile(groupAddr, groupContent);

  // Delete home directory
  const homeAddr = await findInDir(C.ROOT_DIR_ADDR, 'home');
  if (homeAddr !== -1) {
    const oldUser = FS.cur_user_name;
    const oldGroup = FS.cur_group_name;
    const oldDir = FS.cur_dir_addr;
    const oldDirName = FS.cur_dir_name;

    FS.cur_user_name = 'root';
    FS.cur_group_name = 'root';
    FS.cur_dir_addr = C.ROOT_DIR_ADDR;
    FS.cur_dir_name = '/';

    await DeleteDir(homeAddr, username);

    FS.cur_user_name = oldUser;
    FS.cur_group_name = oldGroup;
    FS.cur_dir_addr = oldDir;
    FS.cur_dir_name = oldDirName;
  }

  printLine('用户删除成功', 'info');
  await saveSession();
}

function removeLineContaining(text, substr) {
  return text.split('\n').filter(line => !line.includes(substr)).join('\n');
}
function removeUserFromGroup(groupContent, username) {
  return groupContent.split('\n').map(line => {
    if (line.includes(username)) {
      return line.replace(new RegExp(`,?${username}`), '');
    }
    return line;
  }).join('\n');
}

// ============================================================
// 8. CHMOD
// ============================================================
async function Chmod(parentAddr, name, mode) {
  if (name === '.' || name === '..') { printLine('usage: chmod [filename] [permissions]', 'error'); return; }
  const result = await findDirEntry(parentAddr, name);
  if (!result) { printLine('当前文件名不存在', 'error'); return; }
  const target = await readInode(result.entry.inode_addr);
  if (!target) return;
  if (FS.cur_user_name !== target.user_name && FS.cur_user_name !== 'root') { printLine('', 'error'); return; }
  target.inode_mode = (target.inode_mode >> 9 << 9) | mode;
  await writeInode(result.entry.inode_addr, target);
  printLine(`权限已修改为 ${mode.toString(8)}`, 'info');
}

// ============================================================
// 9. FORMAT SYSTEM
// ============================================================
async function formatSystem() {
  // Clear all data
  const allInodes = await dbGetAll('inodes');
  for (const i of allInodes) await dbDel('inodes', i.addr);
  const allBlocks = await dbGetAll('blocks');
  for (const b of allBlocks) await dbDel('blocks', b.addr);
  inodeCache.clear();
  blockCache.clear();

  // Reset superblock
  FS.superBlock = mkSuperBlock();
  FS.inodeBitmap = new Uint8Array(C.INODE_NUM);
  FS.blockBitmap = new Uint8Array(C.BLOCK_NUM);

  // Initialize free block stack (group linking)
  const totalGroups = Math.ceil(C.BLOCK_NUM / C.BLOCKS_PER_GROUP);
  for (let g = totalGroups - 1; g >= 0; g--) {
    const stack = new Array(C.BLOCKS_PER_GROUP).fill(-1);
    if (g === totalGroups - 1) {
      stack[0] = -1;
    } else {
      stack[0] = C.BLOCK_STARTADDR + (g+1) * C.BLOCKS_PER_GROUP * C.BLOCK_SIZE;
    }
    for (let j = 1; j < C.BLOCKS_PER_GROUP; j++) {
      stack[j] = C.BLOCK_STARTADDR + (g * C.BLOCKS_PER_GROUP + j) * C.BLOCK_SIZE;
    }
    const addr = C.BLOCK_STARTADDR + g * C.BLOCKS_PER_GROUP * C.BLOCK_SIZE;
    await writeBlockDataAsAddrs(addr, stack);
  }

  // *** BUGFIX: Populate superblock free stack from first group on disk ***
  const group0Addr = C.BLOCK_STARTADDR;
  const group0Data = await readBlockDataByAddr(group0Addr);
  if (group0Data) {
    for (let i = 0; i < C.BLOCKS_PER_GROUP; i++) FS.superBlock.s_free[i] = group0Data[i];
  }

  await saveSuperBlock();
  await saveBitmaps();

  // Create root directory
  const rootInodeAddr = await INodeAlloc();
  const rootBlockAddr = await BlockAlloc();
  const rootEntries = [{ name: '.', inode_addr: rootInodeAddr }];
  await writeBlock(rootBlockAddr, packDirEntries(rootEntries));

  const rootInode = newINode();
  rootInode.inode_id = 0;
  rootInode.user_name = 'root';
  rootInode.user_group = 'root';
  rootInode.inode_cnt = 1;
  rootInode.inode_dirblock[0] = rootBlockAddr;
  rootInode.inode_size = C.BLOCK_SIZE;
  rootInode.inode_mode = C.MODE_DIR | C.DIR_DEFAULT_PERMISSION;
  await writeInode(rootInodeAddr, rootInode);

  // Create directories
  FS.cur_user_name = 'root';
  FS.cur_group_name = 'root';
  FS.cur_dir_addr = C.ROOT_DIR_ADDR;
  FS.cur_dir_name = '/';
  FS.is_login = true;
  FS.nextUID = 1;
  FS.nextGID = 1;

  await MakeDir(C.ROOT_DIR_ADDR, 'home');
  const homeAddr = await FindDir(C.ROOT_DIR_ADDR, 'home');
  if (homeAddr > 0) {
    FS.cur_dir_addr = homeAddr;
    FS.cur_dir_name = '/home';
    const origUser = FS.cur_user_name;
    const origGroup = FS.cur_group_name;
    FS.cur_user_name = 'root';
    FS.cur_group_name = 'root';
    await MakeDir(homeAddr, 'root');
    // chmod 0660
    await Chmod(homeAddr, 'root', 0660);
    FS.cur_user_name = origUser;
    FS.cur_group_name = origGroup;
  }

  FS.cur_dir_addr = C.ROOT_DIR_ADDR;
  FS.cur_dir_name = '/';
  await MakeDir(C.ROOT_DIR_ADDR, 'etc');
  const etcAddr = await FindDir(C.ROOT_DIR_ADDR, 'etc');
  if (etcAddr > 0) {
    FS.cur_dir_addr = etcAddr;
    FS.cur_dir_name = '/etc';
    await Touch(etcAddr, 'user');
    const userInode = await readInode(etcAddr);
    if (userInode) {
      for (let di = 0; di < 10; di++) {
        const ba = userInode.inode_dirblock[di];
        if (ba === -1) continue;
        const data = await readBlock(ba);
        if (!data) continue;
        const entries = unpackDirEntries(data);
        for (const entry of entries) {
          if (entry.name === 'user') {
            await writeTextFile(entry.inode_addr, 'root:x:0:0\n');
          }
        }
      }
    }

    await Touch(etcAddr, 'passwd');
    const pInode = await readInode(etcAddr);
    if (pInode) {
      for (let di = 0; di < 10; di++) {
        const ba = pInode.inode_dirblock[di];
        if (ba === -1) continue;
        const data = await readBlock(ba);
        if (!data) continue;
        const entries = unpackDirEntries(data);
        for (const entry of entries) {
          if (entry.name === 'passwd') {
            await writeTextFile(entry.inode_addr, 'root:root\n');
            // chmod 0660
            const passwdInode = await readInode(entry.inode_addr);
            if (passwdInode) {
              passwdInode.inode_mode = (passwdInode.inode_mode >> 9 << 9) | 0660;
              await writeInode(entry.inode_addr, passwdInode);
            }
          }
        }
      }
    }

    await Touch(etcAddr, 'group');
    const gInode = await readInode(etcAddr);
    if (gInode) {
      for (let di = 0; di < 10; di++) {
        const ba = gInode.inode_dirblock[di];
        if (ba === -1) continue;
        const data = await readBlock(ba);
        if (!data) continue;
        const entries = unpackDirEntries(data);
        for (const entry of entries) {
          if (entry.name === 'group') {
            await writeTextFile(entry.inode_addr, 'root::0:root\nuser::1:\n');
          }
        }
      }
    }
  }

  FS.cur_dir_addr = C.ROOT_DIR_ADDR;
  FS.cur_dir_name = '/';
  FS.is_login = false;
  FS.cur_user_name = '';
  FS.cur_group_name = '';

  printLine('格式化完成', 'info');
  await saveSession();
  return true;
}

// ============================================================

async function saveSession() {
  await dbPut('meta', { key: 'session', value: {
    cur_user_name: FS.cur_user_name, cur_group_name: FS.cur_group_name,
    cur_dir_addr: FS.cur_dir_addr, cur_dir_name: FS.cur_dir_name,
    cur_user_dir_name: FS.cur_user_dir_name, is_login: FS.is_login,
    nextUID: FS.nextUID, nextGID: FS.nextGID
  }});
}
async function loadSession() {
  const sess = await dbGet('meta', 'session');
  if (sess) {
    const s = sess.value;
    FS.cur_user_name = s.cur_user_name || '';
    FS.cur_group_name = s.cur_group_name || '';
    FS.cur_dir_addr = s.cur_dir_addr || C.ROOT_DIR_ADDR;
    FS.cur_dir_name = s.cur_dir_name || '/';
    FS.cur_user_dir_name = s.cur_user_dir_name || '';
    FS.is_login = s.is_login || false;
    FS.nextUID = s.nextUID || 1;
    FS.nextGID = s.nextGID || 1;
  }
}

// ============================================================
// 11. INITIALIZATION
// ============================================================
async function initSystem() {
  const formattedRec = await dbGet('meta', 'formatted');
  const formatted = formattedRec ? formattedRec.value : false;
  await loadSuperBlock();
  await loadBitmaps();
  await loadSession();

  if (!FS.superBlock) {
    printLine('检测到新系统，正在初始化...', 'info');
    FS.superBlock = mkSuperBlock();
    await formatSystem();
    await dbPut('meta', { key: 'formatted', value: true });
    printLine('系统初始化完成！', 'info');
  }

  FS.initialized = true;
  await saveSession();
  updateUI();
}

// ============================================================
// 12. COMMAND PROCESSOR
// ============================================================
async function executeCommand(cmdLine) {
  if (!cmdLine.trim()) return;
  printLine(`$ ${cmdLine}`, 'cmd');

  const parts = cmdLine.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  if (!FS.is_login && cmd !== 'login') {
    printLine('请先登录。输入 login 或点击侧栏登录。', 'error');
    return;
  }

  switch (cmd) {
    case 'login':
      openModal('login-modal');
      break;
    case 'logout':
    case 'exit':
      doQuit();
      break;
    case 'ls':
      await ShowDir(FS.cur_dir_addr);
      break;
    case 'pwd':
      printLine(FS.cur_dir_name, 'output');
      break;
    case 'cd':
      if (args.length === 0) { printLine('用法: cd [目录名]', 'error'); break; }
      await doCd(args[0]);
      break;
    case 'mkdir':
      if (args.length === 0) { openModal('mkdir-modal'); break; }
      await MakeDir(FS.cur_dir_addr, args[0]);
      break;
    case 'rmdir':
      if (args.length === 0) { openModal('rmdir-modal'); break; }
      await DeleteDir(FS.cur_dir_addr, args[0]);
      break;
    case 'touch':
      if (args.length === 0) { openModal('touch-modal'); break; }
      await Touch(FS.cur_dir_addr, args[0]);
      break;
    case 'cat':
      if (args.length === 0) { printLine('用法: cat [文件名]', 'error'); break; }
      const content = await Cat(FS.cur_dir_addr, args[0]);
      if (content !== null) {
        showCatContent(args[0], content);
      }
      break;
    case 'rm':
      if (args.length === 0) { printLine('用法: rm [文件名]', 'error'); break; }
      await RemoveFile(FS.cur_dir_addr, args[0]);
      break;
    case 'nano':
      if (args.length === 0) { printLine('用法: nano [文件名]', 'error'); break; }
      await openNano(args[0]);
      break;
    case 'chmod':
      if (args.length < 2) { printLine('用法: chmod [文件名] [权限码]', 'error'); break; }
      const mode = parseInt(args[1], 8);
      if (isNaN(mode)) { printLine('权限码必须是八进制数', 'error'); break; }
      await Chmod(FS.cur_dir_addr, args[0], mode);
      break;
    case 'useradd':
      openModal('useradd-modal');
      break;
    case 'userdel':
      openModal('userdel-modal');
      break;
    case 'help':
      printLine('支持的命令:', 'info');
      printLine('  login          - 登录系统', 'output');
      printLine('  logout / exit  - 登出系统', 'output');
      printLine('  ls             - 列出目录', 'output');
      printLine('  cd [dir]       - 切换目录', 'output');
      printLine('  pwd            - 显示当前路径', 'output');
      printLine('  mkdir [dir]    - 创建目录', 'output');
      printLine('  rmdir [dir]    - 删除目录', 'output');
      printLine('  touch [file]   - 创建文件', 'output');
      printLine('  cat [file]     - 查看文件', 'output');
      printLine('  rm [file]      - 删除文件', 'output');
      printLine('  nano [file]    - 编辑文件', 'output');
      printLine('  chmod [f] [m]  - 修改权限', 'output');
      printLine('  useradd        - 添加用户', 'output');
      printLine('  userdel        - 删除用户', 'output');
      printLine('  format         - 格式化(仅root)', 'output');
      printLine('  help           - 显示帮助', 'output');
      printLine('  status         - 磁盘/Inode使用仪表盘', 'output');
      printLine('  infolist       - 所有文件和inode列表', 'output');
      printLine('  clear          - 清屏', 'output');
      break;
    case 'status':
      showDashboard(true);
      break;
    case 'infolist':
      await doInfolist();
      break;
    case 'clear':
      document.getElementById('terminal').innerHTML = '';
      break;
    case 'format':
      if (FS.cur_user_name !== 'root') { printLine('Permission Dennied', 'error'); break; }
      await formatSystem();
      await dbPut('meta', { key: 'formatted', value: true });
      doQuit();
      break;
    default:
      printLine(`command not found: ${cmdLine}`, 'error');
  }
  await saveSession();
  updateUI();
}

async function doCd(target) {
  if (target === '/') {
    FS.cur_dir_addr = C.ROOT_DIR_ADDR;
    FS.cur_dir_name = '/';
    updateUI();
    return;
  }
  if (target === '..') {
    const newAddr = await FindDir(FS.cur_dir_addr, '..');
    if (newAddr > 0) {
      FS.cur_dir_addr = newAddr;
      // Update path
      const idx = FS.cur_dir_name.lastIndexOf('/');
      if (idx <= 0) { FS.cur_dir_name = '/'; }
      else { FS.cur_dir_name = FS.cur_dir_name.substring(0, idx); }
      updateUI();
    } else { printLine('无法返回上级目录', 'error'); }
    return;
  }
  // Handle paths with / (absolute or relative)
  if (target.includes('/')) {
    const parts = target.split('/').filter(Boolean);
    let currentAddr = target.startsWith('/') ? C.ROOT_DIR_ADDR : FS.cur_dir_addr;
    let currentPath = target.startsWith('/') ? '/' : FS.cur_dir_name;
    let success = true;
    for (const part of parts) {
      if (part === '.') continue;
      if (part === '..') {
        const na = await FindDir(currentAddr, '..');
        if (na > 0) { currentAddr = na; currentPath = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/'; }
        else { success = false; break; }
      } else {
        const na = await FindDir(currentAddr, part);
        if (na > 0) { currentAddr = na; currentPath = currentPath === '/' ? '/' + part : currentPath + '/' + part; }
        else { printLine(`找不到该目录: ${part}`, 'error'); success = false; break; }
      }
    }
    if (success) { FS.cur_dir_addr = currentAddr; FS.cur_dir_name = currentPath; updateUI(); }
    return;
  }
  const newAddr = await FindDir(FS.cur_dir_addr, target);
  if (newAddr === -1) { printLine(`找不到该目录: ${target}`, 'error'); }
  else if (newAddr === -2) { printLine(`${target} 不是目录`, 'error'); }
  else if (newAddr === -3) { printLine('Permission Dennied', 'error'); }
  else {
    FS.cur_dir_addr = newAddr;
    if (FS.cur_dir_name === '/') FS.cur_dir_name = '/' + target;
    else FS.cur_dir_name = FS.cur_dir_name + '/' + target;
    updateUI();
  }
}

  FS.is_login = false;

  FS.cur_dir_addr = C.ROOT_DIR_ADDR;

// Nano editor
let nanoFilename = '';
async function openNano(filename) {
  nanoFilename = filename;
  document.getElementById('nano-filename').textContent = filename;
  // Try to read existing content
  const result = await findDirEntry(FS.cur_dir_addr, filename);
  if (result) {
    const inode = await readInode(result.entry.inode_addr);
    if (inode && !((inode.inode_mode >> 9) & 1)) {
      const content = await readFileContent(inode);
      document.getElementById('nano-content').value = content;
    } else {
      document.getElementById('nano-content').value = '';
    }
  } else {
    document.getElementById('nano-content').value = '';
  }
  openModal('nano-modal');
}

async function doNanoSave() {
  const content = document.getElementById('nano-content').value;
  closeModal('nano-modal');

  // Check if file exists
  const result = await findDirEntry(FS.cur_dir_addr, nanoFilename);
  if (result) {
    // Update existing
    const inode = await readInode(result.entry.inode_addr);
    if (inode) {
      if (!checkPerm(inode, 1)) {
        printLine('Permission denied.', 'error');
        return;
      }
      await WriteFile(result.entry.inode_addr, content);
      printLine(`文件 ${nanoFilename} 已保存`, 'info');
    }
  } else {
    // Create new
    let findPos = { blockIdx: -1, entryIdx: -1 };
    const parentInode = await readInode(FS.cur_dir_addr);
    if (parentInode) {
      for (let di = 0; di < 10; di++) {
        const ba = parentInode.inode_dirblock[di];
        if (ba === -1) continue;
        const data = await readBlock(ba);
        if (!data) continue;
        const entries = unpackDirEntries(data);
        for (let j = 0; j < entries.length; j++) {
          if (entries[j].name === '' && findPos.blockIdx === -1) {
            findPos = { blockIdx: di, entryIdx: j };
          }
        }
      }
    }
    if (findPos.blockIdx === -1) {
      printLine('无空闲目录项', 'error');
      return;
    }
    const ok = await createFile(FS.cur_dir_addr, nanoFilename, content, findPos, parentInode);
    if (ok) printLine(`文件 ${nanoFilename} 已创建并保存`, 'info');
  }
}

async function renderDashboard() {
  const dashboard = document.getElementById('dashboard');
  dashboard.innerHTML = '';

  const sb = FS.superBlock;
  if (!sb) { dashboard.innerHTML = '<div class="term-line error">系统未初始化</div>'; return; }

  const totalBlocks = sb.s_BLOCK_NUM;
  const totalInodes = sb.s_INODE_NUM;
  const usedBlocks = totalBlocks - sb.s_free_BLOCK_NUM;
  const usedInodes = totalInodes - sb.s_free_INODE_NUM;
  const diskPctRaw = totalBlocks > 0 ? (usedBlocks / totalBlocks * 100) : 0;
  const diskPctInt = Math.round(diskPctRaw);
  const diskPctDisplay = (diskPctInt === 0 && usedBlocks > 0) ? '<1' : String(diskPctInt);
  const inodePctRaw = totalInodes > 0 ? (usedInodes / totalInodes * 100) : 0;
  const inodePctInt = Math.round(inodePctRaw);
  const inodePctDisplay = (inodePctInt === 0 && usedInodes > 0) ? '<1' : String(inodePctInt);

  // Gather inode data from DB for deeper analytics
  let allInodes = [];
  let dirCount = 0, fileCount = 0;
  try {
    allInodes = await dbGetAll('inodes');
    for (const inode of allInodes) {
      if ((inode.inode_mode >> 9) & 1) dirCount++;
      else fileCount++;
    }
  } catch (e) { /* ignore */ }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 1: Stats Cards
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // Close button bar
  const closeBar = document.createElement('div');
  closeBar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px;flex-shrink:0;';
  closeBar.innerHTML = '<span style="font-size:16px;font-weight:700;color:var(--green)">📊 磁盘可视化仪表盘</span>' +
    '<button onclick="closeDashboard()" style="background:var(--accent);color:#fff;border:none;border-radius:4px;padding:6px 16px;cursor:pointer;font-size:13px;font-weight:600;">✕ 返回终端</button>';
  dashboard.appendChild(closeBar);

  const cardsRow = document.createElement('div');
  cardsRow.className = 'db-cards-row db-fade-in db-delay-1';
  cardsRow.innerHTML = `
    <div class="db-card c-disk">
      <div class="db-card-icon">💾</div>
      <div class="db-card-label">磁盘</div>
      <div class="db-card-value">${diskPctInt === 0 && usedBlocks > 0 ? '<1' : `<span class="count-up" data-target="${diskPctInt}">0</span>`}% 已用</div>
      <div class="db-card-detail">${usedBlocks} / ${totalBlocks} 块</div>
    </div>
    <div class="db-card c-inode">
      <div class="db-card-icon">📝</div>
      <div class="db-card-label">Inode</div>
      <div class="db-card-value">${inodePctInt === 0 && usedInodes > 0 ? '<1' : `<span class="count-up" data-target="${inodePctInt}">0</span>`}% 已用</div>
      <div class="db-card-detail">${usedInodes} / ${totalInodes}</div>
    </div>
    <div class="db-card c-dir">
      <div class="db-card-icon">📂</div>
      <div class="db-card-label">目录</div>
      <div class="db-card-value">${dirCount}</div>
      <div class="db-card-detail">共 ${dirCount + fileCount} 个条目</div>
    </div>
    <div class="db-card c-file">
      <div class="db-card-icon">📄</div>
      <div class="db-card-label">文件</div>
      <div class="db-card-value">${fileCount}</div>
      <div class="db-card-detail">共 ${dirCount + fileCount} 个条目</div>
    </div>
  `;
  dashboard.appendChild(cardsRow);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 2: Animated Donut Charts
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const chartsRow = document.createElement('div');
  chartsRow.className = 'db-charts-row db-fade-in db-delay-2';
  chartsRow.appendChild(makeDonutChart('磁盘使用', usedBlocks, sb.s_free_BLOCK_NUM, '#e94560', '#4ecca3',
    `已用: ${usedBlocks} / 共 ${totalBlocks} 块`));
  chartsRow.appendChild(makeDonutChart('Inode使用', usedInodes, sb.s_free_INODE_NUM, '#5dade2', '#4ecca3',
    `已用: ${usedInodes} / 共 ${totalInodes}`));
  dashboard.appendChild(chartsRow);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 3: Block Allocation Map (全盘块图)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const blockSection = document.createElement('div');
  blockSection.className = 'db-section db-fade-in db-delay-3';
  blockSection.innerHTML = `<div class="db-section-title">全盘块图 (${C.BLOCK_NUM} 块 — 256×40)</div>`;

  const mapWrap = document.createElement('div');
  mapWrap.className = 'db-blockmap-wrap';

  const mapCanvas = document.createElement('canvas');
  const COLS = 256, ROWS = 40;
  const CELL = 4, GAP = 1;
  const pw = COLS * (CELL + GAP);
  const ph = ROWS * (CELL + GAP);
  mapCanvas.width = pw;
  mapCanvas.height = ph;
  mapCanvas.className = 'db-blockmap-canvas';

  const mapTooltip = document.createElement('div');
  mapTooltip.className = 'db-blockmap-tooltip';

  mapWrap.appendChild(mapCanvas);
  mapWrap.appendChild(mapTooltip);
  blockSection.appendChild(mapWrap);

  // Legend
  const mapLegend = document.createElement('div');
  mapLegend.className = 'db-blockmap-legend';
  mapLegend.innerHTML = `
    <span><span class="swatch" style="background:#e94560;"></span> 文件数据</span>
    <span><span class="swatch" style="background:#5dade2;"></span> 目录数据</span>
    <span><span class="swatch" style="background:#ffc107;"></span> 元数据</span>
    <span><span class="swatch" style="background:#2a2a3a;"></span> 空闲</span>
  `;
  blockSection.appendChild(mapLegend);
  dashboard.appendChild(blockSection);

  // Draw block map
  const mctx = mapCanvas.getContext('2d');

  // Helper: convert byte address to global block index
  function addrToBlockIdx(addr) { return Math.floor(addr / C.BLOCK_SIZE); }

  // Collect ALL used block positions from all inodes (both files and directories)
  const usedBlocksSet = new Set();
  for (const inode of allInodes) {
    const dirb = inode.inode_dirblock;
    if (dirb) {
      for (let i = 0; i < 10; i++) {
        if (dirb[i] >= 0) {
          const pos = addrToBlockIdx(dirb[i]);
          if (pos >= 0 && pos < C.BLOCK_NUM) usedBlocksSet.add(pos);
        }
      }
    }
  }
  // Also check indirect block
  for (const inode of allInodes) {
    if (inode.inode_indirect_block_first >= 0) {
      const pos = addrToBlockIdx(inode.inode_indirect_block_first);
      if (pos >= 0 && pos < C.BLOCK_NUM) usedBlocksSet.add(pos);
    }
  }

  const METADATA_END = 183; // blocks 0..182 = superblock+bitmaps+inode table

  // Count how many data blocks (non-metadata) are used
  let dataUsedCount = 0;
  for (const pos of usedBlocksSet) {
    if (pos >= METADATA_END) dataUsedCount++;
  }

  // Update section title to include counts
  const blockTitle = blockSection.querySelector('.db-section-title');
  if (blockTitle) {
    blockTitle.textContent = `全盘块图 (${C.BLOCK_NUM} 块 — 元数据 ${METADATA_END} 数据已用 ${dataUsedCount})`;
  }

  // Build dirBlocks set for distinguishing dir vs file in coloring
  const dirBlocksSet = new Set();
  for (const inode of allInodes) {
    if ((inode.inode_mode >> 9) & 1) {
      const dirb = inode.inode_dirblock;
      if (dirb) {
        for (let i = 0; i < 10; i++) {
          if (dirb[i] >= 0) {
            const pos = addrToBlockIdx(dirb[i]);
            if (pos >= 0 && pos < C.BLOCK_NUM) dirBlocksSet.add(pos);
          }
        }
      }
    }
  }

  for (let i = 0; i < C.BLOCK_NUM; i++) {
    const r = Math.floor(i / COLS);
    const c = i % COLS;
    const x = c * (CELL + GAP);
    const y = r * (CELL + GAP);

    let color;
    if (i < METADATA_END) {
      color = '#ffc107';
    } else if (usedBlocksSet.has(i)) {
      color = dirBlocksSet.has(i) ? '#5dade2' : '#e94560';
    } else {
      color = '#2a2a3a';
    }
    mctx.fillStyle = color;
    mctx.fillRect(x, y, CELL, CELL);
  }

  // Tooltip
  mapCanvas.onmousemove = function (e) {
    const rect = this.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const c = Math.floor(mx / (CELL + GAP));
    const r = Math.floor(my / (CELL + GAP));
    const idx = r * COLS + c;
    if (idx >= 0 && idx < C.BLOCK_NUM) {
      let label;
      if (idx < METADATA_END) label = '元数据';
      else if (usedBlocksSet.has(idx)) label = dirBlocksSet.has(idx) ? '目录数据' : '文件数据';
      else label = '空闲';
      mapTooltip.style.display = 'block';
      mapTooltip.style.left = (mx + 12) + 'px';
      mapTooltip.style.top = (my - 8) + 'px';
      mapTooltip.textContent = 'Block ' + idx + ': ' + label;
    } else {
      mapTooltip.style.display = 'none';
    }
  };
  mapCanvas.onmouseleave = function () { mapTooltip.style.display = 'none'; };

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 3.5: Data Block Detail — 放大视图
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const detailSection = document.createElement('div');
  detailSection.className = 'db-section db-fade-in db-delay-3';

  const dataBlocks = [];
  for (let i = METADATA_END; i < C.BLOCK_NUM; i++) {
    if (usedBlocksSet.has(i)) {
      dataBlocks.push({ idx: i, isDir: dirBlocksSet.has(i) });
    }
  }

  const detailTitle = document.createElement('div');
  detailTitle.className = 'db-section-title';
  detailTitle.textContent = `数据块明细 (${dataBlocks.length} 块)`;
  detailSection.appendChild(detailTitle);

  if (dataBlocks.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color:var(--fg2);padding:10px;font-size:13px;';
