    const note = document.createElement('div');
    note.style.cssText = 'font-size:12px;color:var(--fg2);margin-bottom:8px;';
    note.textContent = '每个方块代表一个数据块，悬停显示详情：';
    note.innerHTML += ' <span style="color:#5dade2;">■</span> 目录 <span style="color:#e94560;margin-left:10px;">■</span> 文件';
    detailSection.appendChild(note);

    const blockGrid = document.createElement('div');
    blockGrid.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;';
    for (const b of dataBlocks) {
      const cell = document.createElement('div');
      cell.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default;';
      cell.title = `Block ${b.idx} (${b.isDir ? '目录数据' : '文件数据'})`;
      const square = document.createElement('div');
      square.style.cssText = `width:24px;height:24px;border-radius:4px;background:${b.isDir ? '#5dade2' : '#e94560'};transition:transform .15s;`;
      square.onmouseenter = function () { this.style.transform = 'scale(1.3)'; };
      square.onmouseleave = function () { this.style.transform = 'scale(1)'; };
      const label = document.createElement('span');
      label.style.cssText = 'font-size:10px;color:var(--fg2);font-family:monospace;';
      label.textContent = b.idx;
      cell.appendChild(square);
      cell.appendChild(label);
      blockGrid.appendChild(cell);
    }
    detailSection.appendChild(blockGrid);
  }

  dashboard.appendChild(detailSection);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 4: Interactive Directory Tree
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const treeSection = document.createElement('div');
  treeSection.className = 'db-section db-fade-in db-delay-4';
  treeSection.innerHTML = `<div class="db-section-title">目录树</div>`;

  const treeContainer = document.createElement('div');
  treeContainer.className = 'db-tree';
  treeContainer.innerHTML = '<div style="color:var(--fg2);padding:6px;">加载中...</div>';
  treeSection.appendChild(treeContainer);
  dashboard.appendChild(treeSection);

  // Build tree asynchronously
  buildDirectoryTree(C.ROOT_DIR_ADDR, treeContainer).catch(function () {
    treeContainer.innerHTML = '<div style="color:var(--accent);padding:6px;">无法加载目录树</div>';
  });

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 5: User Storage Usage
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const userSection = document.createElement('div');
  userSection.className = 'db-section db-fade-in db-delay-5';
  userSection.innerHTML = `<div class="db-section-title">用户存储使用</div>`;

  const userBarDiv = document.createElement('div');
  userBarDiv.className = 'db-userbar-section';
  userSection.appendChild(userBarDiv);
  dashboard.appendChild(userSection);
  buildUserBars(allInodes, userBarDiv);

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // SECTION 6: Superblock Info Grid
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const sbSection = document.createElement('div');
  sbSection.className = 'db-section db-fade-in db-delay-6';
  sbSection.innerHTML = `<div class="db-section-title">超级块信息</div>`;

  const totalGroups = Math.ceil(C.BLOCK_NUM / C.BLOCKS_PER_GROUP);
  const sbGrid = document.createElement('div');
  sbGrid.className = 'db-sb-grid';
  const sbItems = [
    ['Block大小', sb.s_BLOCK_SIZE + ' B'],
    ['Inode大小', sb.s_INODE_SIZE + ' B'],
    ['总Blocks', sb.s_BLOCK_NUM],
    ['总Inodes', sb.s_INODE_NUM],
    ['空闲Blocks', sb.s_free_BLOCK_NUM],
    ['空闲Inodes', sb.s_free_INODE_NUM],
    ['块组数', totalGroups],
    ['每块组Blocks', C.BLOCKS_PER_GROUP],
  ];
  sbGrid.innerHTML = sbItems.map(function (item) {
    return '<div class="db-sb-item"><div class="sb-label">' + item[0] + '</div><div class="sb-value">' + item[1] + '</div></div>';
  }).join('');
  sbSection.appendChild(sbGrid);
  dashboard.appendChild(sbSection);

  // ── Trigger count-up animation ──
  animateCountUps();
}

// ──────────────────────────────────────────────
// Animated Donut Chart (canvas, sweep animation)
// ──────────────────────────────────────────────
function makeDonutChart(title, used, free, usedColor, freeColor, summary) {
  const wrap = document.createElement('div');
  wrap.className = 'db-chart-wrap';

  const canvas = document.createElement('canvas');
  canvas.width = 280;
  canvas.height = 280;
  canvas.style.cssText = 'background:#16213e; border-radius:8px; border:1px solid #2a2a4a; display:block;';

  const ctx = canvas.getContext('2d');
  const cx = 140, cy = 140, radius = 110, innerR = 75;
  const total = used + free;
  const pct = total > 0 ? Math.round(used / total * 100) : 0;

  // Draw background ring (semi-transparent free color)
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = freeColor + '33';
  ctx.fill();

  // Animated sweep
  const startAngle = -Math.PI / 2;
  const sweepAngle = total > 0 ? (used / total) * Math.PI * 2 : 0;
  const duration = 800;
  const startTime = performance.now();

  function animate(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const currentAngle = startAngle + sweepAngle * eased;

    // Clear and redraw
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = freeColor + '33';
    ctx.fill();

    // Used sweep with glow
    ctx.shadowColor = usedColor;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, currentAngle);
    ctx.closePath();
    ctx.fillStyle = usedColor;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner cutout
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
    ctx.fillStyle = '#16213e';
    ctx.fill();

    // Center title
    ctx.fillStyle = '#e0e0e0';
    ctx.font = 'bold 14px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, cx, cy - 18);

    // Percentage (animated value)
    ctx.font = 'bold 28px Consolas, monospace';
    ctx.fillStyle = usedColor;
    const displayPct = Math.round(pct * eased);
    ctx.fillText(displayPct + '%', cx, cy + 14);

    // Sub-label
    ctx.font = '11px Consolas, monospace';
    ctx.fillStyle = '#a0a0c0';
    ctx.fillText('已用/总计', cx, cy + 44);

    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }

  requestAnimationFrame(animate);

  wrap.appendChild(canvas);

  const label = document.createElement('div');
  label.className = 'db-chart-label';
  label.textContent = summary;
  wrap.appendChild(label);

  return wrap;
}

// ──────────────────────────────────────────────
// Count-up animation for stat cards
// ──────────────────────────────────────────────
function animateCountUps() {
  var counters = document.querySelectorAll('.count-up');
  counters.forEach(function (el) {
    var target = parseInt(el.getAttribute('data-target'));
    if (isNaN(target)) return;
    var duration = 600;
    var startTime = performance.now();
    function update(currentTime) {
      var elapsed = currentTime - startTime;
      var progress = Math.min(elapsed / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      var current = Math.round(target * eased);
      el.textContent = current;
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  });
}

// ──────────────────────────────────────────────
// Interactive Directory Tree builder
// ──────────────────────────────────────────────
async function buildDirectoryTree(addr, container) {
  var rootInode = await readInode(addr);
  if (!rootInode) {
    container.innerHTML = '<div style="color:var(--accent);padding:6px;">无法读取根目录</div>';
    return;
  }
  var html = '<div class="db-tree-item root-item">'
    + '<span class="db-tree-toggle">▼</span>'
    + '<span class="db-tree-name">/</span>'
    + '<span class="db-tree-badge dir-badge">目录</span>'
    + '</div>'
    + '<div class="db-tree-children">'
    + await buildTreeChildren(addr)
    + '</div>';
  container.innerHTML = html;

  // Event delegation for collapse/expand
  container.addEventListener('click', function (e) {
    var item = e.target.closest('.db-tree-item');
    if (!item) return;
    var children = item.nextElementSibling;
    if (!children || !children.classList.contains('db-tree-children')) return;
    var toggle = item.querySelector('.db-tree-toggle');
    if (children.style.display === 'none') {
      children.style.display = '';
      if (toggle) toggle.textContent = '▼';
    } else {
      children.style.display = 'none';
      if (toggle) toggle.textContent = '▶';
    }
  });
}

async function buildTreeChildren(dirAddr) {
  var inode = await readInode(dirAddr);
  if (!inode) return '';

  var seen = new Set();
  var entries = [];

  for (var di = 0; di < 10; di++) {
    var ba = inode.inode_dirblock[di];
    if (ba === -1) continue;
    var data = await readBlock(ba);
    if (!data) continue;
    var parsed = unpackDirEntries(data);
    for (var j = 0; j < parsed.length; j++) {
      var entry = parsed[j];
      if (!entry.name || entry.name === '.' || entry.name === '..') continue;
      if (seen.has(entry.name)) continue;
      seen.add(entry.name);
      entries.push(entry);
    }
  }

  var html = '';
  for (var i = 0; i < entries.length; i++) {
    var name = entries[i].name;
    var entryAddr = entries[i].inode_addr;
    var isLast = i === entries.length - 1;
    var prefix = isLast ? '└── ' : '├── ';
    var childInode = await readInode(entryAddr);
    var isDir = childInode && ((childInode.inode_mode >> 9) & 1);

    if (isDir) {
      html += '<div class="db-tree-item">'
        + '<span class="db-tree-toggle">▶</span>'
        + '<span class="db-tree-name">' + prefix + name + '</span>'
        + '<span class="db-tree-badge dir-badge">目录</span>'
        + '</div>'
        + '<div class="db-tree-children" style="display:none;">'
        + await buildTreeChildren(entryAddr)
        + '</div>';
    } else {
      html += '<div class="db-tree-item">'
        + '<span class="db-tree-toggle" style="visibility:hidden;">▶</span>'
        + '<span class="db-tree-name file">' + prefix + name + '</span>'
        + '<span class="db-tree-badge file-badge">文件</span>';
      if (childInode) {
        html += '<span class="db-tree-size">' + childInode.inode_size + ' B</span>';
      }
      html += '</div>';
    }
  }
  return html;
}

// ──────────────────────────────────────────────
// User Storage Bar Chart
// ──────────────────────────────────────────────
function buildUserBars(allInodes, container) {
  var userStorage = {};
  for (var i = 0; i < allInodes.length; i++) {
    var inode = allInodes[i];
    var name = inode.user_name || 'unknown';
    if (!userStorage[name]) userStorage[name] = 0;
    userStorage[name] += inode.inode_size || 0;
  }

  var users = Object.keys(userStorage);
  if (users.length === 0) {
    container.innerHTML = '<div style="color:var(--fg2);padding:8px;font-family:monospace;">无数据</div>';
    return;
  }

  var maxStorage = 0;
  for (var u = 0; u < users.length; u++) {
    if (userStorage[users[u]] > maxStorage) maxStorage = userStorage[users[u]];
  }
  if (maxStorage === 0) maxStorage = 1;
  var maxDisplay = C.BLOCK_NUM * C.BLOCK_SIZE;

  var html = '';
  for (var u = 0; u < users.length; u++) {
    var user = users[u];
    var used = userStorage[user];
    var pct = (used / maxStorage) * 100;
    html += '<div class="db-userbar-row">'
      + '<div class="db-userbar-label">' + user + '</div>'
      + '<div class="db-userbar-track">'
      + '<div class="db-userbar-fill" style="width:' + pct + '%;background:linear-gradient(90deg,#4ecca3,#5dade2);"></div>'
      + '<span class="db-userbar-text">' + formatSize(used) + ' / ' + formatSize(maxDisplay) + '</span>'
      + '</div>'
      + '</div>';
  }

  container.innerHTML = html;
}

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function doInfolist() {
  const allInodes = await dbGetAll('inodes');
  if (!allInodes || allInodes.length === 0) {
    printLine('没有找到任何 inode', 'output');
    return;
  }
  // Sort by inode_id
  allInodes.sort((a, b) => a.inode_id - b.inode_id);
  // Header
  printLine('地址\t\tID\t类型\t权限\t\t链接\t所有者\t组\t大小\t文件名', 'info');
  for (const ino of allInodes) {
    const isDir = (ino.inode_mode >> 9) & 1;
    const type = isDir ? '目录' : '文件';
    const perm = permToString(ino.inode_mode);
    const sizeStr = ino.inode_size + ' B';
    // Use inode_id as filename stand-in since inodes don't store names
    const fname = ino.inode_id === 0 ? '/' : '-' + ino.inode_id;
    printLine(`${ino.addr}\t${ino.inode_id}\t${type}\t${perm}\t${ino.inode_cnt}\t${ino.user_name}\t${ino.user_group}\t${sizeStr}\t${fname}`, 'output');
  }
}

        { cmd: 'infolist', label: '文件列表', desc: '查看所有文件和inode' },

    {
      icon: '🔐', name: '会话管理', open: true,
      items: [
        { cmd: 'login', label: '登录系统', desc: '登录到文件系统' },
        { cmd: 'exit', label: '登出系统', desc: '退出当前用户' },
      ]
    },

      icon: '📂', name: '目录操作', open: true,

    },

      icon: '📄', name: '文件操作', open: false,
      items: [
        { cmd: 'touch', label: 'touch', desc: '创建空文件' },
        { cmd: 'cat', label: 'cat', desc: '查看文件内容' },
        { cmd: 'rm', label: 'rm', desc: '删除文件' },
        { cmd: 'nano', label: 'nano', desc: '编辑文件' },
        { cmd: 'chmod', label: 'chmod', desc: '修改权限' },
      ]
    },
    {
      icon: '👥', name: '用户管理', open: false,
      items: [
        { cmd: 'useradd', label: 'useradd', desc: '添加新用户' },
        { cmd: 'userdel', label: 'userdel', desc: '删除用户' },
      ]
    },
    {
      icon: '⚙️', name: '系统工具', open: false,
      items: [

  for (const cat of categories) {

    div.className = 'cat' + (cat.open ? ' open' : '');
    div.innerHTML = `<div class="cat-header"><span class="icon">${cat.icon}</span>${cat.name}<span class="arrow">▶</span></div>`;
    const body = document.createElement('div');
    body.className = 'cat-body';
    for (const item of cat.items) {
      const ci = document.createElement('div');
      ci.className = 'cmd-item';
      ci.innerHTML = `<span class="cmd-badge">${item.cmd}</span>${item.desc}`;
      ci.onclick = () => onSidebarCmd(item.cmd);
      body.appendChild(ci);
    }
    div.appendChild(body);
    div.querySelector('.cat-header').onclick = () => {
      div.classList.toggle('open');
    };
    sidebar.appendChild(div);
  }
}

function onSidebarCmd(cmd) {
  // Close dashboard if open (any sidebar command switches back to terminal)
  const dashboard = document.getElementById('dashboard');
  if (dashboard && dashboard.style.display !== 'none') {
    showDashboard(false);
  }
  document.getElementById('cmd-input').value = cmd;
  executeCommand(cmd);
}

// ============================================================
// 15. EVENT BINDING & INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar();

  const input = document.getElementById('cmd-input');
  const execBtn = document.getElementById('cmd-exec');

  execBtn.onclick = () => {
    const val = input.value.trim();
    if (val) { input.value = ''; executeCommand(val); }
  };
  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      const val = input.value.trim();
      if (val) { input.value = ''; executeCommand(val); }
    }
  };

  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.onclick = (e) => {
      if (e.target === el) el.classList.remove('active');
    };
  });

  initSystem();
});
